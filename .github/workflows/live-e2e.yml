name: Live E2E diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
      - name: Diagnose real provider responses (outside the deterministic release gate)
        run: npm run test:e2e:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-e2e-diagnostics
          path: |
            playwright-report/live/
            test-results/live/
          retention-days: 14
