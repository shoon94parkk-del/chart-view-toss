name: Generate TikTok-compatible promo assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-tiktok-webp.yml"

permissions:
  contents: write

jobs:
  generate-webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Convert promo PNGs to WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          base = Path("public/marketing/2026-09")
          for png in base.glob("*.png"):
              out = png.with_suffix(".webp")
              with Image.open(png) as im:
                  if im.mode not in ("RGB", "RGBA"):
                      im = im.convert("RGBA")
                  if im.mode == "RGBA":
                      bg = Image.new("RGB", im.size, "white")
                      bg.paste(im, mask=im.getchannel("A"))
                      im = bg
                  else:
                      im = im.convert("RGB")
                  im.save(out, "WEBP", quality=92, method=6)
                  print(out)
          PY
          test -s public/marketing/2026-09/chartview-toss-promo-story.webp

      - name: Remove one-time workflow
        run: git rm .github/workflows/generate-tiktok-webp.yml

      - name: Commit WebP variants
        run: |
          git add public/marketing/2026-09
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add TikTok-compatible WebP promo assets"
          git push origin HEAD:main
