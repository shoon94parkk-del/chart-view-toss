name: Main regression contract

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm test

  audit-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Install pinned QA browser
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify approved audit journeys
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/chartview-audit-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          QA_BASE_URL=http://127.0.0.1:4173 node tests/audit_plan_qa.mjs
      - name: Upload audit screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-audit-journeys
          path: output/playwright/audit-plan
          if-no-files-found: warn

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, android-chromium, narrow-chromium, iphone-small-webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Install pinned browser and OS dependencies
        run: npx playwright install --with-deps ${{ matrix.project == 'iphone-small-webkit' && 'webkit' || 'chromium' }}
      - name: Install Korean fonts for real text geometry
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Build the tested commit with production request behavior
        run: npm run build
      - name: Run deterministic browser and data integration tests
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Upload report, screenshots, trace, video and request evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
