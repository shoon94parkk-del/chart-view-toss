# audit-run: trust-ux-production-20261002
name: Production performance audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/perf-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Measure live routes
        env:
          QA_BASE_URL: https://chart-view-toss.onrender.com
          QA_OUTPUT: docs/performance-latest.json
        run: node scripts/measure-site.mjs
      - name: Save measured result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/performance-latest.json /tmp/performance-latest.json

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            cp /tmp/performance-latest.json docs/performance-latest.json
            git add docs/performance-latest.json

            if git diff --cached --quiet; then
              echo "Performance result is already current."
              exit 0
            fi

            git commit -m "docs: record latest production performance"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying (${attempt}/3)."
          done

          echo "Could not save performance result after 3 retries."
          exit 1
