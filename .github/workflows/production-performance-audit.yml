name: Production route performance audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/production_performance_audit.mjs'
      - '.github/workflows/production-performance-audit.yml'
  workflow_dispatch:

jobs:
  production-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Chromium audit dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit live route loading
        env:
          PERF_BASE_URL: https://chart-view-toss.onrender.com
          PERF_TIMEOUT_MS: '20000'
        run: node tests/production_performance_audit.mjs
