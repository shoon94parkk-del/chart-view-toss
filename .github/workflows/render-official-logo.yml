name: Render official Chart View logo PNG

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-official-logo.yml"

permissions:
  contents: write

jobs:
  render-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install SVG renderer
        run: python -m pip install --quiet cairosvg

      - name: Render official PNG from SVG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='public/chartview-logo.svg',
              write_to='public/chartview-logo-600.png',
              output_width=600,
              output_height=600,
          )
          PY
          file public/chartview-logo-600.png
          test -s public/chartview-logo-600.png

      - name: Remove one-time workflow
        run: git rm .github/workflows/render-official-logo.yml

      - name: Commit logo asset
        run: |
          git add public/chartview-logo-600.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: regenerate official Chart View logo PNG"
          git push origin HEAD:main
