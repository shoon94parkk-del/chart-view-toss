name: Import Chart View promo assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-promo-assets-20260930.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download promo assets
        run: |
          set -euo pipefail
          mkdir -p public/marketing/2026-09
          curl --fail --location --retry 3 "https://static.metricool.com/planner/202609/7152037-file-6513258393156859171.png" -o public/marketing/2026-09/chartview-toss-promo-clean.png
          curl --fail --location --retry 3 "https://static.metricool.com/planner/202609/7152037-file-10482770634727075951.png" -o public/marketing/2026-09/chartview-toss-promo-story.png
          curl --fail --location --retry 3 "https://static.metricool.com/planner/202609/7152037-file-593187211381459278.png" -o public/marketing/2026-09/chartview-toss-promo-dark.png
          curl --fail --location --retry 3 "https://static.metricool.com/planner/202609/7152037-file-14848124384315264306.png" -o public/marketing/2026-09/chartview-toss-promo-soft.png
          file public/marketing/2026-09/*.png
          test -s public/marketing/2026-09/chartview-toss-promo-clean.png
          test -s public/marketing/2026-09/chartview-toss-promo-story.png
          test -s public/marketing/2026-09/chartview-toss-promo-dark.png
          test -s public/marketing/2026-09/chartview-toss-promo-soft.png

      - name: Remove one-time importer
        run: git rm .github/workflows/import-promo-assets-20260930.yml

      - name: Commit reusable promo assets
        run: |
          git add public/marketing/2026-09
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: add reusable Chart View promo variants"
          git push origin HEAD:main
