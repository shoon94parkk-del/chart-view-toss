name: Post-opt production performance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/perf-postopt.yml

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Measure latest live routes
        env:
          QA_BASE_URL: https://chart-view-toss.onrender.com
          QA_OUTPUT: docs/performance-postopt.json
        run: node scripts/measure-site.mjs
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/performance-postopt.json
          git diff --cached --quiet || git commit -m "docs: record post-optimization performance"
          git push
