name: Make TikTok-safe promo images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/make-tiktok-safe.yml"

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python -m pip install --quiet pillow
      - name: Resize all WebP promo images to TikTok-safe bounds
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          base=Path("public/marketing/2026-09")
          for src in base.glob("*.webp"):
              with Image.open(src) as im:
                  im=im.convert("RGB")
                  im.thumbnail((1080,1080), Image.Resampling.LANCZOS)
                  out=src.with_name(src.stem+"-tiktok.webp")
                  im.save(out,"WEBP",quality=92,method=6)
                  print(out, im.size)
          PY
          test -s public/marketing/2026-09/chartview-toss-promo-clean-tiktok.webp
      - run: git rm .github/workflows/make-tiktok-safe.yml
      - name: Commit
        run: |
          git add public/marketing/2026-09
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: add TikTok-safe 1080p promo images"
          git push origin HEAD:main
