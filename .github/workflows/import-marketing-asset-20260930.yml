name: Import Chart View marketing asset

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-marketing-asset-20260930.yml"

permissions:
  contents: write

jobs:
  import-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download reusable promo image
        run: |
          mkdir -p public/marketing
          curl --fail --location --retry 3 \
            "https://static.metricool.com/planner/202609/7152037-file-17580862796436809412.png" \
            --output public/marketing/chartview-toss-instagram-20260930.png
          file public/marketing/chartview-toss-instagram-20260930.png
          test -s public/marketing/chartview-toss-instagram-20260930.png

      - name: Commit promo asset
        run: |
          git add public/marketing/chartview-toss-instagram-20260930.png
          if git diff --cached --quiet; then
            echo "Asset already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: add reusable Chart View promo asset"
          git push origin HEAD:main
