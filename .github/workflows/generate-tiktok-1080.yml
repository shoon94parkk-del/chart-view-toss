name: Generate TikTok 1080 promo assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-tiktok-1080.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate TikTok-safe images
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src_dir = Path("public/marketing/2026-09")
          out_dir = src_dir / "tiktok"
          out_dir.mkdir(parents=True, exist_ok=True)

          names = [
              "chartview-toss-promo-clean",
              "chartview-toss-promo-story",
              "chartview-toss-promo-dark",
              "chartview-toss-promo-soft",
          ]

          for name in names:
              src = src_dir / f"{name}.png"
              out = out_dir / f"{name}-1080.webp"
              with Image.open(src) as im:
                  if im.mode not in ("RGB", "RGBA"):
                      im = im.convert("RGBA")
                  if im.mode == "RGBA":
                      bg = Image.new("RGB", im.size, "white")
                      bg.paste(im, mask=im.getchannel("A"))
                      im = bg
                  else:
                      im = im.convert("RGB")

                  im.thumbnail((1080, 1080), Image.Resampling.LANCZOS)
                  canvas = Image.new("RGB", (1080, 1080), "white")
                  x = (1080 - im.width) // 2
                  y = (1080 - im.height) // 2
                  canvas.paste(im, (x, y))
                  canvas.save(out, "WEBP", quality=92, method=6)
                  print(name, canvas.size)
          PY

          for f in public/marketing/2026-09/tiktok/*.webp; do
            test -s "$f"
          done

      - name: Remove one-time workflow
        run: git rm .github/workflows/generate-tiktok-1080.yml

      - name: Commit TikTok-safe assets
        run: |
          git add public/marketing/2026-09/tiktok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add TikTok-safe 1080 promo images"
          git push origin HEAD:main
