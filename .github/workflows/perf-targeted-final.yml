name: Final targeted performance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/perf-targeted-final.yml

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Measure target routes
        run: node scripts/measure-targeted-final.mjs
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/performance-targeted-final.json
          git diff --cached --quiet || git commit -m "docs: record final targeted performance"
          git push
