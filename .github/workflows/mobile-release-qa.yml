name: Mobile release QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  chromium-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install QA browser without changing lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build preview with short QA timeout
        env:
          VITE_CHARTVIEW_API_TIMEOUT_MS: '300'
        run: npm run build
      - name: Start preview
        id: start-preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/chart-view-toss-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/chart-view-toss-vite.log
          exit 1
      - name: Run mobile release QA
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: node tests/mobile_release_qa.mjs
      - name: Verify core value entries and exact selection records
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: node tests/value_discovery_qa.mjs
      - name: Verify market-first Home, selection results and purpose navigation
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: node tests/home_journey_qa.mjs
      - name: Verify full sector exploration and refresh failure retention
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: node tests/sector_heatmap_qa.mjs
      - name: Verify data views and custom date range
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: node tests/analysis_qa.mjs
      - name: Build with production request timeout
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: npm run build
      - name: Verify progressive rendering and navigation races
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: node tests/progressive_qa.mjs
      - name: Verify chart recovery and supported detail navigation
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: node tests/reliability_audit_qa.mjs
      - name: Verify independent export recovery and closed-panel response guards
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: node tests/export_recovery_qa.mjs
      - name: Verify insight navigation, source dates and partial recovery
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: QA_BASE_URL=http://127.0.0.1:4173 node tests/insight_flow_qa.mjs
      - name: Verify export to research, saved evidence and voluntary comparison
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: QA_BASE_URL=http://127.0.0.1:4173 node tests/insight_research_qa.mjs
      - name: Verify search identity, stale disclosure, detail context and empty macro recovery
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: node tests/review_validation_qa.mjs
      - name: Verify unusual screener data and combined-filter recovery
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node tests/strategy_report_qa.mjs
      - name: Verify shared conditions and filter restoration
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node tests/experience_audit_qa.mjs
      - name: Verify review fixes for aliases, score provenance and chart dates
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: node tests/redesign_review_qa.mjs
      - name: Verify deep links, large text and local performance diagnostics
        if: ${{ !cancelled() && steps.start-preview.outcome == 'success' }}
        run: node tests/release_gates_qa.mjs
      - name: Upload mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-qa-screenshots
          path: |
            artifacts/mobile-qa
            artifacts/strategy-report
            artifacts/home-journey
            artifacts/value-discovery
            artifacts/sector-heatmap
            artifacts/redesign-review
            output/playwright/experience-audit
            output/playwright/insight
          if-no-files-found: warn
