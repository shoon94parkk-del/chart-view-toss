<body>
  <div id="app"><div role="status" aria-live="polite" style="padding:72px 24px;text-align:center;font-family:system-ui,sans-serif;color:#4e5968;line-height:1.7"><strong style="color:#191f28">Chart View</strong><p>공시와 시장 데이터를 확인할 화면을 준비하고 있어요.</p></div></div>
  <script>
    (() => {
      const hash = location.hash || '#home';
      if (hash !== '#home' && !hash.startsWith('#home?')) return;
      const base = 'https://chart-view-pkv8.onrender.com';
      const startedAt = Date.now();
      const get = (path) => fetch(base + path, { headers: { Accept: 'application/json' } })
        .then((response) => response.ok ? response.json() : null)
        .catch(() => null);
      window.__chartviewHomeWarm = {
        market: { startedAt, promise: get('/api/market-now') },
        snapshot: { startedAt, promise: get('/api/home-snapshot') },
        bootstrap: { startedAt, promise: get('/api/home-bootstrap') },
      };
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
